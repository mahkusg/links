<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mahkus — Links</title>
  <meta name="description" content="All of Mahkus's links in one place." />
  <meta property="og:title" content="Mahkus — Links" />
  <meta property="og:description" content="Referrals, YouTube, and more." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23111827'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='52'%3E🔗%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
      --bg0: #0b0f19;
      --bg1: #121826;
      --card: #1a2234;
      --card-hover: #243049;
      --text: #f3f6ff;
      --muted: #9aa6bf;
      --accent: #7c9cff;
      --ring: rgba(124, 156, 255, 0.35);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(124, 156, 255, 0.18), transparent 60%),
        radial-gradient(800px 400px at 80% 100%, rgba(167, 139, 250, 0.12), transparent 55%),
        var(--bg0);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    .wrap {
      width: min(420px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.75rem 0 3rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: linear-gradient(145deg, #2a3550, #161d2e);
      border: 2px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .bio {
      margin: 0.45rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .links {
      display: grid;
      gap: 0.75rem;
    }

    a.link {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.95rem 1.05rem;
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset;
      transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    a.link:hover {
      background: var(--card-hover);
      border-color: rgba(124, 156, 255, 0.35);
      transform: translateY(-1px);
      box-shadow: 0 0 0 3px var(--ring);
    }

    a.link:active { transform: translateY(0); }

    a.link:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }

    .emoji {
      width: 1.75rem;
      text-align: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .copy { min-width: 0; }

    .label {
      display: block;
      font-weight: 600;
      font-size: 0.98rem;
      line-height: 1.25;
    }

    .sub {
      display: block;
      margin-top: 0.15rem;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.3;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="avatar" aria-hidden="true">M</div>
      <h1>Mahkus</h1>
      <p class="bio">One link for everything — referrals, videos, and more.</p>
    </header>

    <!-- Edit this list: label, url, emoji, optional subtitle -->
    <nav class="links" id="links" aria-label="Links"></nav>

    <footer>Free static page · update links in the config below</footer>
  </main>

  <script>
    // ===== EDIT YOUR LINKS HERE =====
    const PROFILE = {
      name: "Mahkus",
      bio: "One link for everything — referrals, videos, and more.",
      initial: "M",
    };

    const LINKS = [
      {
        label: "Matic Robots",
        subtitle: "Referral link",
        url: "http://referrals.maticrobots.com/maticrobots/u/mahkus11?sub=maticrobots",
        emoji: "🤖",
      },
      {
        label: "YouTube",
        subtitle: "@themahkus",
        url: "https://youtube.com/@themahkus",
        emoji: "▶️",
      },
      {
        label: "Starlink",
        subtitle: "Referral link",
        url: "https://starlink.com/?referral=RC-3867860-40768-78",
        emoji: "🛰️",
      },
      {
        label: "Tesla",
        subtitle: "Referral link",
        url: "https://ts.la/mark51041",
        emoji: "🚗",
      },
    ];
    // ===== END CONFIG =====

    document.querySelector("h1").textContent = PROFILE.name;
    document.querySelector(".bio").textContent = PROFILE.bio;
    document.querySelector(".avatar").textContent = PROFILE.initial;
    document.title = PROFILE.name + " — Links";

    const nav = document.getElementById("links");
    for (const item of LINKS) {
      const a = document.createElement("a");
      a.className = "link";
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.innerHTML =
        '<span class="emoji" aria-hidden="true">' + (item.emoji || "🔗") + "</span>" +
        '<span class="copy"><span class="label"></span>' +
        (item.subtitle ? '<span class="sub"></span>' : "") +
        "</span>";
      a.querySelector(".label").textContent = item.label;
      const sub = a.querySelector(".sub");
      if (sub) sub.textContent = item.subtitle;
      nav.appendChild(a);
    }
  </script>
</body>
</html>
